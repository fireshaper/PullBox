[project]
name = "pullbox"
version = "0.1.0"
description = "A self-hosted comic book acquisition manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "apscheduler>=4.0.0a6",
    "fastapi[standard]>=0.115.0,<0.136",
    "httpx>=0.27.0,<1.0",
    "lxml>=5.0.0",
    "pydantic-settings>=2.3.0,<3",
    "pyyaml>=6.0.0",
    "sniffio>=1.3.1",
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "uvicorn[standard]>=0.30.0,<0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
